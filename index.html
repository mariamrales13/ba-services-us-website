<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BA Services US</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#101c38;--line:#1e2d4f;--cream:#f0eee5;--mute:#c4cbdb;--gold:#fcd707;
--display:'Abril Fatface',Georgia,serif;--sans:'Jost','Century Gothic',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--cream);font:400 18px/1.6 var(--sans);display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--cream);color:var(--bg);padding:12px 18px;z-index:10;font-weight:600}.skip:focus{left:8px}
header{border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px;padding:0 clamp(24px,10vw,144px);flex-wrap:wrap}
.left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
nav{display:flex;flex-wrap:wrap}
nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px 0 0;margin-right:10px;font-size:15px;font-weight:500;text-decoration:none}
nav a:hover{text-decoration:underline;text-underline-offset:6px}
.lang{display:flex;gap:2px;margin-left:8px}
.lang button{min-width:44px;min-height:44px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:500 14px var(--sans);cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--cream);border-bottom-color:var(--cream)}
.brand{display:block}.brand img{display:block;height:34px;width:auto}
main{flex:1;padding:clamp(48px,9vh,96px) clamp(24px,10vw,144px) 96px}
h1{font:400 clamp(44px,6.8vw,104px)/1.02 var(--display);margin:0;max-width:10.6em;letter-spacing:-.005em}
.lead{max-width:36ch;margin:clamp(24px,4vh,40px) 0;color:var(--mute);font-size:clamp(17px,1.5vw,20px)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;font:600 16px var(--sans);text-decoration:none;border:1px solid var(--cream)}
.btn.p{background:var(--cream);color:var(--bg)}.btn.p:hover{background:#fff}
.btn.s{color:var(--cream)}.btn.s:hover{background:rgba(240,238,229,.1)}
@media (max-width:760px){.brand{order:-1}.bar{padding-top:12px;padding-bottom:4px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

main{padding:0}section,.ess{padding:clamp(64px,9vw,112px) clamp(24px,10vw,144px)}
.hero{padding-top:clamp(48px,9vh,96px);padding-bottom:96px}
.deco{width:100%;height:auto}.ess{display:flex;flex-wrap:wrap;gap:8px 40px;padding-top:22px;padding-bottom:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:400 clamp(22px,2.6vw,32px) var(--display)}.ess span::after{content:"."}
.alt{background:#16264a}.paper{background:#f0eee5;color:#101c38}.paper .mute,.paper .c p{color:#3d4a66}.paper :focus-visible{outline-color:#101c38}
h2{font:400 clamp(32px,4.4vw,56px)/1.05 var(--display);margin:0 0 32px;max-width:20ch}.two h2{max-width:none}
h3.sub{font:600 20px var(--sans);margin:56px 0 16px}
.pairs>div{display:grid;grid-template-columns:1fr 72px 1.4fr;align-items:center;gap:24px;padding:18px 0;border-top:1px solid #33466f}.pairs .a{color:var(--mute)}.pairs .b{font-weight:600}.pairs p{margin:0}.ar svg{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}.paper .two p{margin:0 0 16px;color:#3d4a66}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.c{border:1px solid #33466f;padding:28px}.paper .c{border-color:#c9c5b4}.c svg{width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:1.6;margin-bottom:14px}
.c h3{font:600 20px/1.3 var(--sans);margin:0 0 6px}.c p{margin:0;color:var(--mute);font-size:16px}.c .nm{font:400 26px/1.2 var(--display);margin-bottom:6px}
.note{margin-top:32px;color:var(--mute);font-size:15px}
.reach{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-top:24px}.leg{font-size:15px;color:var(--mute)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--cream);margin:0 8px 0 0;vertical-align:-1px}.dot.f{background:var(--gold);border-color:var(--gold)}.leg .dot:last-of-type{margin-left:18px}
.steps{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid #101c38}
.steps li{padding:20px 20px 0 0;font:600 22px/1.3 var(--sans)}.steps li::before{content:"→";display:block;font-weight:400;margin-bottom:8px}
#contact .btns{margin:28px 0 0}#contact p{max-width:52ch;color:var(--mute)}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:28px clamp(24px,10vw,144px);border-top:1px solid var(--line);font-size:15px;color:var(--mute)}
@media (max-width:860px){.hero,.two,.reach,.pairs>div{grid-template-columns:1fr}.deco{max-width:220px}.steps{grid-template-columns:1fr}}

html{scroll-padding-top:100px}header{position:sticky;top:0;z-index:20;background:var(--bg)}
#sol{grid-template-columns:repeat(3,1fr)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}.cgrid .note{margin-top:28px}.cgrid .note a{color:var(--mute)}
form{display:grid;gap:18px;max-width:480px}label{display:grid;gap:6px;font-weight:500;font-size:15px}
input,textarea{font:inherit;padding:12px 14px;min-height:48px;border:2px solid #8da0c8;background:#f0eee5;color:#101c38;width:100%;border-radius:0}textarea{min-height:140px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.btn{cursor:pointer}#ok{min-height:1.5em;margin:0;color:var(--mute)}
@media (max-width:860px){#sol,.cgrid{grid-template-columns:1fr}.ar{display:none}.pairs .b::before{content:"→ ";color:var(--gold)}}
</style>
</head>
